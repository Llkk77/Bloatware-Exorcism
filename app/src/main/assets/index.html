<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Bloatware Exorcism</title>
<link rel="stylesheet" href="material.css">
<script src="vendor/material.js"></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div id="preview" role="status"></div>
<header><div class="brand"><span class="seal" id="brand-icon"></span><div><strong>Bloatware Exorcism</strong><small>A little less possessed.</small></div></div><md-icon-button class="round" aria-label="About the app" onclick="about()" id="about-icon"></md-icon-button></header>
<main id="content" tabindex="-1"></main>
<nav class="bottom" aria-label="Main navigation"><span class="rail-label">Your system, your choice</span><div class="nav-inner" id="navigation"></div></nav>
<div id="modal-root"></div><div id="busy-root"></div><div id="toast-root" role="status" aria-live="polite"></div>
<script>
const paths={ghost:'M5 21V10a7 7 0 0 1 14 0v11l-3-2-4 2-4-2-3 2Z M9 10v2 M15 10v2 M10 16h4',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z',scan:'M8 3H4v4 M16 3h4v4 M4 17v4h4 M20 17v4h-4 M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0',shield:'m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z m-3 9 2 2 4-4',backup:'M5 7h14v14H5V7Z M8 7V3h8v4 M9 12h6 M12 12v5 m-2-2 2 2 2-2',restore:'M4 10a8 8 0 1 1 1 8 M4 4v6h6 M12 8v5l3 2',deep:'M4 7h16 M4 12h16 M4 17h16 M8 4v6 M16 9v6 M10 14v6',info:'M12 11v6 M12 7h.01 M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20',arrow:'m9 5 7 7-7 7',search:'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14 m5 12 6 6',lock:'M7 10V7a5 5 0 0 1 10 0v3 M5 10h14v11H5V10Z M12 14v3',close:'m6 6 12 12 M6 18 18 6',check:'m5 12 4 4 10-10',download:'M12 3v12 m-5-5 5 5 5-5 M4 17v4h16v-4',coffee:'M5 7h12v9a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7Z M17 9h2a3 3 0 0 1 0 6h-2 M8 3v1 M13 3v1'};
const icon=(n,c='')=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.ghost}"/></svg>`;
const buttonIcon=(n,c='')=>icon(n,c).replace('<svg','<svg slot="icon"');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'home',data:{device:{root:false,catalogCount:139},apps:[],history:[],snapshots:[]},selected:new Set(),advanced:false,rescue:false,query:'',filter:'review',busy:false};
const isPreview=!window.Exorcism;
let sequence=0,toastTimer;const pending=new Map();
function api(op,args={}){if(isPreview)return demo(op,args);return new Promise((resolve,reject)=>{const id=String(++sequence);pending.set(id,{resolve,reject});window.Exorcism.request(op,JSON.stringify(args),id)})}
window.receive=r=>{const p=pending.get(r.id);if(!p)return;pending.delete(r.id);r.ok?p.resolve(r.data):p.reject(new Error(r.error))};
async function task(label,fn){if(state.busy)return;state.busy=true;document.querySelectorAll('main,nav,header').forEach(el=>el.inert=true);document.getElementById('content').setAttribute('aria-busy','true');document.getElementById('busy-root').innerHTML=`<div class="busy" role="status" aria-live="polite"><div class="busy-surface"><md-circular-progress indeterminate aria-label="Working"></md-circular-progress><b>${esc(label)}</b><small>Operations are verified one at a time.<br>Keep the app open.</small></div></div>`;try{return await fn()}catch(e){toast(e.message);return null}finally{state.busy=false;document.querySelectorAll('main,nav,header').forEach(el=>el.inert=false);document.getElementById('content').removeAttribute('aria-busy');document.getElementById('busy-root').innerHTML=''}}
function toast(text){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML=`<div class="toast">${esc(text)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',6500)}
async function refresh(){state.data=await api('scan');if(state.data.device.theme)window.applyDeviceTheme(state.data.device.theme);const known=new Set(state.data.apps.map(a=>a.package));state.selected=new Set([...state.selected].filter(p=>known.has(p)));render()}
const riskName={candidate:'Review first',optional:'Optional feature',advanced:'Advanced',protected:'Protected',unknown:'Unclassified'};
const eligible=a=>a.risk==='candidate'||a.risk==='optional'||(state.page==='deep'&&state.advanced&&a.risk==='advanced');
const date=t=>new Date(t).toLocaleString('en-US',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function navigate(page){if(state.busy)return;state.page=page;state.selected.clear();state.query='';state.filter=page==='deep'?'advanced':'review';closeModal();render();window.scrollTo(0,0);const main=document.getElementById('content');main.classList.remove('page-enter');void main.offsetWidth;main.classList.add('page-enter');main.focus({preventScroll:true})}
function navigation(){const items=[['home','ghost','Home'],['detect','scan','Packages'],['backup','backup','Backups'],['restore','restore','Restore'],['deep','deep','Advanced']];document.getElementById('navigation').innerHTML=items.map(([p,i,l])=>`<button id="nav-${p}" class="nav-item ${state.page===p?'active':''}" ${state.page===p?'aria-current="page"':''} onclick="navigate('${p}')"><span class="nav-symbol">${icon(i)}<md-ripple for="nav-${p}"></md-ripple></span><span>${l}</span></button>`).join('')}
function rootButton(){return `<md-filled-tonal-button touch-target="wrapper" class="btn ${state.data.device.root?'light':''} full" onclick="connect()">${buttonIcon('shield')}${state.data.device.root?'Check root connection':'Grant root access'}</md-filled-tonal-button>`}
function appRow(a){const selectable=eligible(a);return `<div class="app-row ${state.selected.has(a.package)?'selected':''}" data-package="${esc(a.package)}"><span class="app-icon">${esc(a.label.slice(0,1))}</span><button class="app-info" onclick="detail('${esc(a.package)}')"><md-ripple></md-ripple><strong>${esc(a.label)}</strong><span class="pkg">${esc(a.package)}</span><span class="tags"><span class="badge ${a.risk}">${riskName[a.risk]}</span>${!a.enabled?'<span class="badge">Disabled</span>':''}</span></button>${selectable?`<md-checkbox class="check" touch-target="wrapper" aria-label="Select ${esc(a.label)}" ${state.selected.has(a.package)?'checked':''} onchange="selectApp('${esc(a.package)}',this.checked)"></md-checkbox>`:icon('lock','lock')}</div>`}
function selectApp(p,on){if(on&&state.selected.size>=30){toast('Select up to 30 packages per operation.');renderList();return}on?state.selected.add(p):state.selected.delete(p);document.querySelectorAll('.app-row').forEach(row=>{if(row.dataset.package===p)row.classList.toggle('selected',on)});renderSelection()}
function renderSelection(){const el=document.getElementById('selection');if(!el)return;document.body.classList.toggle('has-selection',state.selected.size>0);const advanced=[...state.selected].some(p=>state.data.apps.find(a=>a.package===p)?.risk==='advanced');el.innerHTML=state.selected.size?`<div class="selection"><div class="selection-heading"><b>${state.selected.size} package${state.selected.size===1?'':'s'} selected</b><md-text-button touch-target="wrapper" class="text-button" onclick="clearSelection()">Clear</md-text-button></div><p>${advanced?'Advanced packages require review.':'One tap applies the action to your selection.'} Automatic backup before changes.</p><div class="button-row"><md-outlined-button touch-target="wrapper" class="btn outline" ${!state.data.device.root?'disabled':''} onclick="applySelected('disable')">${buttonIcon('shield')}Disable selected</md-outlined-button><md-filled-button touch-target="wrapper" class="btn" ${!state.data.device.root?'disabled':''} onclick="applySelected('remove')">${buttonIcon('spark')}Remove selected</md-filled-button></div><small>For the current user. Restore changes in Resurrection.</small>${!state.data.device.root?'<md-filled-tonal-button touch-target="wrapper" class="btn light full" style="margin-top:10px" onclick="connect()">Grant root access to continue</md-filled-tonal-button>':''}</div>`:'';window.enhanceMaterial()}
function applySelected(action){if(state.busy||!state.data.device.root||!state.selected.size)return;const advanced=[...state.selected].some(p=>state.data.apps.find(a=>a.package===p)?.risk==='advanced');if(advanced)confirmApply(action);else executeApply(action)}
async function scanPackages(){navigate('detect');await task('Scanning installed packages…',refresh)}

function home(){const d=state.data.device;const found=state.data.apps.filter(a=>a.risk==='candidate'||a.risk==='optional').length;const protectedCount=state.data.apps.filter(a=>a.risk==='protected').length;const modified=state.data.history.filter(a=>a.status==='done'&&!a.restored).length;const top=state.data.apps.filter(a=>a.risk==='candidate').slice(0,5);return `<div class="home-overview"><section class="hero"><div class="eyebrow">Your system, your choice</div><h1>Keep the essential.<br>Exorcise the excess.</h1><p>A thoughtful cleanup. Select packages. Tap to remove.</p><span class="root-pill"><span class="dot ${d.root?'on':''}"></span>${d.root?'Root authorized · user '+d.user:'KernelSU · awaiting connection'}</span><md-filled-button touch-target="wrapper" class="btn hero-action" onclick="${d.root?'scanPackages()':'connect()'}">${buttonIcon(d.root?'scan':'shield')}${d.root?'Find bloatware':'Grant root access'}</md-filled-button><div class="ghost-art"><div class="orb"></div>${icon('ghost')}<span class="spark">✧</span></div></section><div class="overview-side"><div class="stats"><div class="stat"><b>${found}</b><span>to review</span></div><div class="stat"><b>${protectedCount}</b><span>protected</span></div><div class="stat"><b>${modified}</b><span>changes</span></div></div><div class="mini-grid"><button onclick="makeBackup()"><md-ripple></md-ripple>${icon('backup')}<strong>Create backup</strong><small>Holy Backup · save package states</small></button><button onclick="navigate('restore')"><md-ripple></md-ripple>${icon('restore')}<strong>Restore packages</strong><small>Resurrection · undo your changes</small></button></div><button class="card action-card full" style="width:100%;text-align:left;color:inherit" onclick="scanPackages()"><md-ripple></md-ripple><span class="tile-icon">${icon('scan')}</span><span class="text"><h3>Scan installed apps</h3><p>Detect Demons · find packages to remove</p></span>${icon('arrow','arrow')}</button></div></div><div class="section-head"><h2>Select packages to clean</h2><md-text-button touch-target="wrapper" class="text-button" onclick="scanPackages()">View all</md-text-button></div>${top.length?top.map(appRow).join(''):`<div class="empty">${icon('shield')}No priority candidates found.<br>Explore optional features in Detect Demons.</div>`}<div id="selection"></div><div class="notice">A catalog match does not prove excessive resource use. No packages are selected automatically.</div><div class="device-line">${esc(d.model||'Loading device…')} · Android ${esc(d.android||'—')}<br>${esc(d.build||'')} · ${state.data.apps.length} visible system packages</div><div class="footer-note">Designed with care · v0.3.0</div>`}
function listPage(deep=false){return `<div class="kicker">${deep?'Control with care':'Local diagnostics'}</div><h1 class="page-title">${deep?'Deep Exorcism':'Detect Demons'}</h1><p class="subtext">${deep?'Inspect services and review advanced components. Critical dependencies stay protected.':'Find packages on your device and understand what each one does.'}</p>${rootButton()}${deep?`<div class="notice warn">Community classification, not yet validated on this build. Drivers, libraries and thermal protection are preserved.</div><div class="card"><label class="advanced-toggle"><md-checkbox class="check" touch-target="wrapper" aria-label="Enable advanced package selection for this session" ${state.advanced?'checked':''} onchange="state.advanced=this.checked;state.selected.clear();renderList()"></md-checkbox><span>Enable advanced package selection for this session</span></label></div><div class="card"><h3>Experimental KernelSU rescue</h3><p>Reverts an explicitly armed batch if boot does not complete. Requires the installed module and an accessible PackageManager.</p><label class="advanced-toggle"><md-checkbox class="check" touch-target="wrapper" aria-label="Arm the next batch before changing packages" ${state.rescue?'checked':''} onchange="state.rescue=this.checked"></md-checkbox><span>Arm the next batch before changing packages</span></label><md-outlined-button touch-target="wrapper" class="btn outline full" style="margin-top:14px" onclick="rescueStatus()">Check rescue module</md-outlined-button></div><button class="card action-card" style="width:100%;text-align:left;color:inherit" onclick="auditNative()"><md-ripple></md-ripple><span class="tile-icon">${icon('deep')}</span><span class="text"><h3>Native and Binder services</h3><p>Inspect status · read only</p></span>${icon('arrow')}</button>`:''}<div class="search"><md-outlined-text-field id="search" label="Search packages" placeholder="App, package or category" value="${esc(state.query)}" oninput="state.query=this.value;renderList()"><svg slot="leading-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths.search}"/></svg></md-outlined-text-field></div><div class="filters"><md-chip-set id="filters" aria-label="Filter packages"></md-chip-set></div><div class="section-head"><span class="small" id="list-count"></span><md-text-button touch-target="wrapper" class="text-button" onclick="clearSelection()">Clear selection</md-text-button></div><div id="app-list"></div><div id="selection"></div>`}
function filterTo(filter){state.filter=filter;renderList();document.querySelector(`[data-filter="${filter}"]`)?.focus()}
function clearSelection(){state.selected.clear();if(state.page==='home')render();else renderList()}
function filterApps(){const q=state.query.toLocaleLowerCase('en-US');return state.data.apps.filter(a=>{if(q&&!`${a.label} ${a.package} ${a.group}`.toLocaleLowerCase('en-US').includes(q))return false;switch(state.filter){case'review':return ['candidate','optional'].includes(a.risk);case'advanced':return a.risk==='advanced';case'protected':return a.risk==='protected';case'unknown':return a.risk==='unknown';case'disabled':return !a.enabled;default:return true}}).sort((a,b)=>a.label.localeCompare(b.label,'en-US'))}
function renderList(){if(!['detect','deep'].includes(state.page)){renderSelection();return}const filters=[['review','To review'],['advanced','Advanced'],['protected','Protected'],['unknown','Unclassified'],['disabled','Disabled'],['all','All']];document.getElementById('filters').innerHTML=filters.map(([f,l])=>`<md-filter-chip touch-target="wrapper" class="chip" data-filter="${f}" label="${l}" ${state.filter===f?'selected':''} onclick="filterTo('${f}')"></md-filter-chip>`).join('');const apps=filterApps();document.getElementById('app-list').innerHTML=apps.length?apps.map(appRow).join(''):`<div class="empty">${icon('scan')}No packages found for this filter.</div>`;document.getElementById('list-count').textContent=`${apps.length} packages · catalog of ${state.data.device.catalogCount} entries`;renderSelection()}
function backupPage(){return `<div class="kicker">A point of return</div><h1 class="page-title">Holy Backup</h1><p class="subtext">Save package states before changing your system.</p><div class="card"><span class="tile-icon">${icon('backup')}</span><h3 style="margin-top:15px">Your system, recorded</h3><p>Installed packages, enabled states, ROM version and Exorcism history. An automatic snapshot is also created before each batch.</p><md-filled-button touch-target="wrapper" class="btn full" onclick="makeBackup()">${buttonIcon('backup')}Create Holy Backup</md-filled-button><md-outlined-button touch-target="wrapper" class="btn outline full" style="margin-top:9px" onclick="importBackup()">Import JSON file</md-outlined-button></div><div class="notice">This backup excludes photos, app data and partition images. Export a copy: local records are lost if you uninstall this app.</div><div class="section-head"><h2>Your restore points</h2><span class="small">${state.data.snapshots.length} records</span></div>${state.data.snapshots.length?`<div class="timeline">${state.data.snapshots.map(s=>`<div class="card"><span class="date">${date(s.created)}</span><h3 style="margin-top:8px">${esc(s.reason)}</h3><p>${s.count} package states · ${s.compatible?'same ROM and user':'different ROM or user'}</p><div class="button-row"><md-filled-tonal-button touch-target="wrapper" class="btn light" onclick="exportBackup('${s.id}')">Export</md-filled-tonal-button><md-outlined-button touch-target="wrapper" class="btn outline" ${!s.compatible?'disabled':''} onclick="compareBackup('${s.id}')">Compare</md-outlined-button></div></div>`).join('')}</div>`:`<div class="empty">${icon('backup')}Your first snapshot starts here.</div>`}`}
function restorePage(){const h=[...state.data.history].reverse();return `<div class="kicker">The way back</div><h1 class="page-title">Resurrection</h1><p class="subtext">Restore changes recorded by this app, starting with the most recent.</p>${rootButton()}<div class="notice">Reinstallation uses the original package still on the system. After a ROM update, compatibility must be reviewed.</div><div class="card"><h3>Device validation</h3><p>Record tested features and export the model, ROM, fingerprint, actions and results. A successful command does not prove functional safety.</p><md-filled-button touch-target="wrapper" class="btn full" onclick="exportReport()">Export JSON report</md-filled-button><p>${(state.data.validations||[]).length} local observations recorded.</p></div><div class="section-head"><h2>Change history</h2><span class="small">${h.length} operations</span></div>${h.length?h.map(e=>`<div class="card history-row"><span class="date">${date(e.created)}</span><h3 style="margin-top:8px">${esc(({remove:'Removal for current user',disable:'Disable',snapshot:'Backup restoration'})[e.action]||e.action)}</h3><span class="pkg">${esc(e.package)}</span><div class="tags"><span class="badge ${e.status==='done'?'candidate':'advanced'}">${e.restored?'Reverted':({done:'Verified',failed:'Failed',pending:'Pending · check status',uncertain:'Check state'})[e.status]||esc(e.status)}</span></div>${e.output?`<details><summary>Operation output</summary><pre>${esc(e.output)}</pre></details>`:''}${!e.restored?`<md-outlined-button touch-target="wrapper" class="btn outline full" style="margin-top:14px" ${!state.data.device.root?'disabled':''} onclick="confirmRestore('${e.id}')">${buttonIcon('restore')}Restore previous state</md-outlined-button><md-filled-tonal-button touch-target="wrapper" class="btn light full" style="margin-top:8px" onclick="validationForm('${e.id}')">Record functional test</md-filled-tonal-button>`:''}</div>`).join(''):`<div class="empty">${icon('restore')}No changes recorded.<br>Your changes will appear here.</div>`}`}
function render(){document.body.classList.toggle('has-selection',state.selected.size>0);navigation();document.getElementById('content').innerHTML=state.page==='home'?home():state.page==='backup'?backupPage():state.page==='restore'?restorePage():listPage(state.page==='deep');if(['detect','deep'].includes(state.page))renderList();else renderSelection()}
function modal(title,body,buttons=''){const returnFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<md-dialog class="modal" aria-label="${esc(title)}"><div slot="headline" class="dialog-heading"><span>${esc(title)}</span><md-icon-button class="close" aria-label="Close" onclick="closeModal()">${icon('close')}</md-icon-button></div><div slot="content" class="dialog-body">${body}</div><div slot="actions" class="button-row">${buttons||'<md-text-button touch-target="wrapper" class="btn" onclick="closeModal()">Got it</md-text-button>'}</div></md-dialog>`;const dialog=document.querySelector('.modal');const opening=dialog.getOpenAnimation,closing=dialog.getCloseAnimation;dialog.getOpenAnimation=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?{}:opening();dialog.getCloseAnimation=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?{}:closing();window.enhanceMaterial();dialog.addEventListener('closed',()=>{if(!dialog.open){dialog.remove();if(returnFocus?.isConnected)returnFocus.focus()}});dialog.show()}
function closeModal(){const dialog=document.querySelector('.modal');if(dialog)dialog.close()}

window.backAction=()=>{if(state.busy)return true;if(document.querySelector('.modal')?.open){closeModal();return true}if(state.page!=='home'){navigate('home');return true}return false};
async function connect(){await task('Checking root access…',async()=>{state.data.device=await api('connect');await refresh();toast('Root authorized. No changes applied.')} )}
function confirmApply(action){const selected=[...state.selected];if(!selected.length)return;modal(action==='remove'?'Time for an exorcism?':'Disable selected packages?',`<p>${action==='remove'?'Packages will be removed only for the current user. Original system files and data preserved by the -k option remain on the device.':'Packages will be disabled for the current user. Their previous states will be recorded.'}</p><p>A Holy Backup will be created before the batch. ${state.page==='deep'&&state.rescue?'The rescue module must also confirm the record before the first change.':''} Related features may stop working.</p><pre>${selected.map(esc).join('\n')}</pre><p>Each operation will be checked. This does not guarantee a performance gain.</p>`,`<md-filled-tonal-button touch-target="wrapper" class="btn light" onclick="closeModal()">Back</md-filled-tonal-button><md-filled-button touch-target="wrapper" class="btn" onclick="executeApply('${action}')">${action==='remove'?'Remove selected':'Disable selected'}</md-filled-button>`)}
async function executeApply(action){if(state.busy||!state.data.device.root||!state.selected.size)return;const packages=[...state.selected];closeModal();await task('Preparing backup and applying changes…',async()=>{const r=await api('apply',{action,packages,advanced:state.page==='deep'&&state.advanced,rescue:state.page==='deep'&&state.rescue});state.selected.clear();await refresh();resultsModal(r.results)})}
function resultsModal(results){const good=results.filter(r=>r.ok).length;modal('Operation complete',`<p>${good} of ${results.length} operations with confirmed states. Open Resurrection to review or revert.</p>${results.map(r=>`<div class="package" style="margin-top:8px"><b>${r.ok?'✓':'!'} ${esc(r.package)}</b><br>${esc(r.message)}</div>`).join('')}`)}
async function detail(name){const a=state.data.apps.find(a=>a.package===name);if(!a)return;modal(a.label,`<div class="package">${esc(a.package)}</div><p><span class="badge ${a.risk}">${riskName[a.risk]}</span> · ${esc(a.group)}</p><p>${esc(a.note)}</p><p>Community classification. Not validated on this build. A declared component does not mean a running service.</p>${a.source?`<details><summary>Classification source</summary><pre>${esc(a.source)}</pre></details>`:''}`,`<md-filled-tonal-button touch-target="wrapper" class="btn light" onclick="closeModal()">Close</md-filled-tonal-button><md-filled-button touch-target="wrapper" class="btn" onclick="inspect('${esc(name)}')">Inspect services</md-filled-button><md-outlined-button touch-target="wrapper" class="btn outline" onclick="exportFixture('${esc(name)}')">Export device fixture</md-outlined-button>`)}
async function inspect(name){closeModal();await task('Inspecting components…',async()=>{const r=await api('inspect',{package:name});modal('Inside the package',`<div class="package">${esc(name)} · ${esc(r.version)}</div><p>${r.components.length} declared components. Enabled states below come from the manifest; they do not measure CPU or battery use.</p><div class="service-list">${r.components.map(c=>`<div class="service-item"><span><b>${esc(c.type)}</b><br>${esc(c.name)}</span><span>${c.enabled?'Enabled':'Disabled'}</span></div>`).join('')||'<p>No components found.</p>'}</div>${r.runtime?`<details><summary>Running services · dumpsys</summary><pre>${esc(r.runtime)}</pre></details>`:'<p>Connect root to inspect running services.</p>'}`)})}
async function makeBackup(){await task('Creating Holy Backup…',async()=>{await api('backup');await refresh();toast('Restore point created. Export a copy.')})}
async function exportBackup(id){await task('Choose where to save…',async()=>{const r=await api('export',{id});toast(r.message)})}
async function importBackup(){await task('Choose a Holy Backup…',async()=>{const r=await api('import');await refresh();toast(r.message)})}
async function compareBackup(id){await task('Comparing states…',async()=>{const r=await api('compareBackup',{id});modal('Backup comparison',`<p>${esc(r.note)}</p><p>${r.changes.length} restorable differences for this ROM and user.</p><pre>${r.changes.map(c=>`${esc(c.package)} → ${c.enabled===0?'default':c.enabled===1?'enabled':'disabled'}`).join('\n')||'Comparable states already match.'}</pre>`,`<md-filled-tonal-button touch-target="wrapper" class="btn light" onclick="closeModal()">Back</md-filled-tonal-button>${r.changes.length?`<md-filled-button touch-target="wrapper" class="btn" onclick="restoreBackup('${id}')">Restore ${r.changes.length} states</md-filled-button>`:''}`)})}
async function restoreBackup(id){closeModal();await task('Restoring Holy Backup…',async()=>{const r=await api('restoreBackup',{id});await refresh();resultsModal(r.results)})}
function confirmRestore(id){modal('Resurrection',`<p>The package will return to its recorded previous state. If needed, it will be reinstalled from the system original.</p><p>The operation will be verified and recorded.</p>`,`<md-filled-tonal-button touch-target="wrapper" class="btn light" onclick="closeModal()">Back</md-filled-tonal-button><md-filled-button touch-target="wrapper" class="btn" onclick="restoreEntry('${id}')">Restore</md-filled-button>`)}
async function restoreEntry(id){closeModal();await task('Restoring previous state…',async()=>{const r=await api('restore',{id});await refresh();toast(r.message)})}
async function auditNative(){await task('Inspecting native services…',async()=>{const r=await api('native');modal('System services',`<p>${r.services.length} init services found. This audit is read only: it does not stop processes or thermal controls.</p><div class="service-list">${r.services.map(s=>`<div class="service-item"><span>${esc(s.name)}</span><span class="badge">${esc(s.state)}</span></div>`).join('')}</div><details><summary>Binder services</summary><pre>${esc(r.binder)}</pre></details>`)})}
function contributions(){modal('Contributions','<p><b>Llkk77</b></p><p><b>ChatGPT</b></p>')}
function about(){modal('A thoughtful cleanup.',`<p><b>Bloatware Exorcism · 0.3.1</b><br>Material You. Device colors, a dark canvas and your choices.</p><p>Focused on MIUI/HyperOS Global and China. Android 10 or later, prioritizing Android 16 testing. Root access uses su and must be authorized in KernelSU.</p><p>Offline, ad free, with no internet permission. Changes are limited to classified system packages. Core components and default functions are protected.</p><p>Does not remove drivers, partition files, kernel modules or thermal protection. This version does not measure CPU, wakelocks or battery use.</p><p>Before use: export Holy Backup and back up personal data separately. Reinstalling the original package does not recover all app data.</p>`,'<md-text-button touch-target="wrapper" class="btn" onclick="contributions()">Contributions</md-text-button><md-text-button touch-target="wrapper" class="btn" onclick="closeModal()">Got it</md-text-button>')}
async function exportReport(){await task('Exporting validation report…',async()=>{const r=await api('exportReport');toast(r.message)})}
async function exportFixture(name){closeModal();await task('Capturing device fixture…',async()=>{const r=await api('exportFixture',{package:name});toast(r.message)})}
function validationForm(id){modal('How is your device working?',`<p>Report only what you tested after this change. This observation belongs to this device and ROM; it is not a guarantee for other users.</p>${[['camera','Camera'],['wifi','Wi-Fi'],['calls','Calls'],['notifications','Notifications'],['bluetooth','Bluetooth'],['nfc','NFC'],['reboot','Reboot']].map(([k,l])=>`<md-outlined-select class="validation-field" data-check="${k}" label="${l}"><md-select-option value="not_tested" selected><div slot="headline">Not tested</div></md-select-option><md-select-option value="pass"><div slot="headline">Passed</div></md-select-option><md-select-option value="fail"><div slot="headline">Failed</div></md-select-option>${['nfc','bluetooth'].includes(k)?'<md-select-option value="not_applicable"><div slot="headline">Not applicable</div></md-select-option>':''}</md-outlined-select>`).join('')}<p>A validatedBuilds entry is only proposed when required features pass, the state matches and a new boot has been observed.</p>`,`<md-filled-tonal-button touch-target="wrapper" class="btn light" onclick="closeModal()">Back</md-filled-tonal-button><md-filled-button touch-target="wrapper" class="btn" onclick="saveValidation('${id}')">Save observation</md-filled-button>`)}
async function saveValidation(id){const checks={};document.querySelectorAll('[data-check]').forEach(e=>checks[e.dataset.check]=e.value);closeModal();await task('Recording validation…',async()=>{const r=await api('recordValidation',{id,checks});await refresh();toast(r.qualifiesForValidatedBuild?'Observation recorded with state and new boot verified.':'Observation recorded; validation criteria remain incomplete.')})}
async function rescueStatus(){await task('Checking rescue status…',async()=>{const r=await api('rescueStatus');modal('Experimental rescue',`<p>${r.available?'Module available. The latest batch must be explicitly armed before the operation.':'Module unavailable.'}</p><pre>${esc(r.details)}</pre><p>After rebooting and testing your device, you can keep the batch. Manual rollback preserves the record if it cannot confirm every state.</p>`,`<md-filled-tonal-button touch-target="wrapper" class="btn light" onclick="closeModal()">Close</md-filled-tonal-button>${r.available?'<md-outlined-button touch-target="wrapper" class="btn outline" onclick="rescueAction(&quot;rescueKeep&quot;)">Tested — keep changes</md-outlined-button><md-filled-button touch-target="wrapper" class="btn" onclick="rescueConfirm()">Roll back armed batch</md-filled-button>':''}`)})}
function rescueConfirm(){modal('Roll back the armed batch?',`<p>The module will try to reinstall original packages and restore previous states from the recorded batch. It does not change the fingerprint or fix other causes of boot failure.</p>`,`<md-filled-tonal-button touch-target="wrapper" class="btn light" onclick="closeModal()">Back</md-filled-tonal-button><md-filled-button touch-target="wrapper" class="btn" onclick="rescueAction('rescueRollback')">Roll back</md-filled-button>`)}
async function rescueAction(op){closeModal();await task('Running rescue operation…',async()=>{const r=await api(op);await refresh();toast(r.message)})}
async function demo(op,args){if(op!=='scan')throw new Error('Visual preview: install the APK on a device to use this feature.');return {device:{model:'Xiaomi · interface preview',android:'16',build:'HyperOS · sample data',root:false,user:0,catalogCount:139},apps:[{package:'com.miui.msa.global',label:'MSA',group:'Advertising',risk:'candidate',enabled:true,note:'Advertising service; review before changing.',source:''},{package:'com.miui.analytics',label:'Xiaomi Analytics',group:'Advertising',risk:'candidate',enabled:true,note:'Community classification.',source:''},{package:'com.miui.hybrid',label:'Quick Apps',group:'Content',risk:'optional',enabled:true,note:'Xiaomi mini apps.',source:''},{package:'com.miui.powerkeeper',label:'Battery & Performance',group:'Protected',risk:'protected',enabled:true,note:'Protected component.',source:''},{package:'com.miui.voiceassist',label:'XiaoAI',group:'AI and voice',risk:'advanced',enabled:true,note:'Voice features.',source:''}],history:[],snapshots:[]}}
window.addEventListener('scroll',()=>document.querySelector('header').classList.toggle('scrolled',window.scrollY>8),{passive:true});
document.getElementById('brand-icon').innerHTML=icon('ghost');document.getElementById('about-icon').innerHTML=icon('info');if(isPreview)document.getElementById('preview').innerHTML='<div class="preview-banner">Interface preview · sample data · no device access</div>';task('Detecting packages…',refresh);
</script>
