name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Policy, fixtures and simulated rescue tests
        run: bash scripts/verify.sh
      - name: Compile APKs and run Android lint
        run: sh gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - name: Prepare APK identity and checksums
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BloatwareExorcism-ci-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/BloatwareExorcism-ci-release-unsigned.apk
          printf 'Source: %s\nRun: %s\nDebug uses an ephemeral test key. Release APK is unsigned.\n' "$SOURCE_COMMIT" "$RUN_URL" > dist/BUILD.txt
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-apks-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
